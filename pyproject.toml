[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "u-flora"
version = "1.0.0"
description = "U-Flora: Efficient federated LoRA fine-tuning of large language models with Flower"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.27.0",
    "flwr-datasets>=0.6.0",
    "torch==2.8.0",
    "bitsandbytes==0.49.1",
    "scipy==1.13.0",
    "peft==0.6.2",
    "transformers==4.53.0",
    "sentencepiece==0.2.1",
    "omegaconf==2.3.0",
    "hf_transfer==0.1.9",
    "evaluate>=0.4.6",
    "scikit-learn>=1.8.0",
    "wandb>=0.25.0",
    "requests>=2.32.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "u_flora.server_app:app"
clientapp = "u_flora.client_app:app"

[tool.flwr.app.config]
# -- Task selector -------------------------------------------------------------
# Controls which TaskAdapter is used. One of: text_classification, causal_lm
task_name = "text_classification"

# -- Dataset selector & partitioning -------------------------------------------
dataset.name = "boolq"                   # Key into [tool.flwr.app.config.datasets.*] below
dataset.partition.strategy = "dirichlet" # "dirichlet" or "iid"
dataset.partition.dirichlet.alpha = 0.5
dataset.partition.dirichlet.seed = 42

# -- Model ---------------------------------------------------------------------
model.name = "answerdotai/ModernBERT-base"
model.lora.peft-lora-r = 8
model.lora.peft-lora-alpha = 16
model.lora.peft-lora-dropout = 0.05
model.lora.peft-target-modules = "Wqkv,attn.Wo"

# -- Training ------------------------------------------------------------------
train.save-every-round = 5
train.learning-rate-max = 5e-4
train.learning-rate-min = 1e-5
train.training-arguments.output-dir = ""
train.training-arguments.learning-rate = ""               # Overridden by dynamic lr scheduler
train.training-arguments.per-device-train-batch-size = 32
train.training-arguments.per-device-eval-batch-size = 32
train.training-arguments.logging-steps = 32
train.training-arguments.report-to = "none"
train.training-arguments.num-train-epochs = 3
train.training-arguments.max-steps = 10
train.training-arguments.save-steps = 1000
train.training-arguments.save-total-limit = 2
train.training-arguments.gradient-checkpointing = false
train.training-arguments.lr-scheduler-type = "constant"

# -- Federation ----------------------------------------------------------------
num-server-rounds = 10
num-clients = 50

# -- Evaluation ----------------------------------------------------------------
eval.batch-size = 64

# -- Experiment tracking -------------------------------------------------------
wandb.project = "u-flora-testbed"
wandb.entity = "ilham-abdillah-alhamdi-universitas-indonesia"
wandb.run-name = ""

# -- Client selection strategy -------------------------------------------------
# name: random | fedcs | tifl | oort
strategy.name = "random"
strategy.seed = 42
strategy.num-to-select = 10

# ==============================================================================
# Strategy-specific configurations
# ==============================================================================
[tool.flwr.app.config.strategies.random]


# ==============================================================================
# Dataset definitions
# ==============================================================================

[tool.flwr.app.config.datasets.boolq]
name = "super_glue"
subset = "boolq"
text_fields = "passage,question"
label_field = "label"
num_labels = 2
train_split = "train"
val_split = "validation"

[tool.flwr.app.config.datasets.mnli]
name = "glue"
subset = "mnli"
text_fields = "premise,hypothesis"
label_field = "label"
num_labels = 3
train_split = "train"
val_split = "validation_matched"

