[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "u-flora"
version = "1.0.0"
description = "U-Flora: Efficient federated LoRA fine-tuning of large language models with Flower"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.27.0",
    "flwr-datasets>=0.6.0",
    "torch==2.8.0",
    "bitsandbytes==0.49.1",
    "scipy==1.13.0",
    "peft==0.6.2",
    "transformers==4.53.0",
    "sentencepiece==0.2.1",
    "omegaconf==2.3.0",
    "hf_transfer==0.1.9",
    "evaluate>=0.4.6",
    "scikit-learn>=1.8.0",
    "wandb>=0.25.0",
    "requests>=2.32.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "u_flora.server_app:app"
clientapp = "u_flora.client_app:app"

[tool.flwr.app.config]
# -- Task selector -------------------------------------------------------------
# Controls which TaskAdapter is used. One of: text_classification, causal_lm
task_name = "text_classification"

# -- Dataset selector & partitioning -------------------------------------------
dataset.name = "boolq"                   # Key into [tool.flwr.app.config.datasets.*] below
dataset.partition.strategy = "dirichlet" # "dirichlet" or "iid"
dataset.partition.dirichlet.alpha = 0.5
dataset.partition.dirichlet.seed = 42

# -- Model ---------------------------------------------------------------------
model.name = "answerdotai/ModernBERT-base"
model.lora.peft-lora-r = 8
model.lora.peft-lora-alpha = 16
model.lora.peft-lora-dropout = 0.05
model.lora.peft-target-modules = "Wqkv,attn.Wo"

# -- Training ------------------------------------------------------------------
train.save-every-round = 5
train.learning-rate-max = 5e-4
train.learning-rate-min = 1e-5
train.training-arguments.output-dir = ""
train.training-arguments.learning-rate = ""               # Overridden by dynamic lr scheduler
train.training-arguments.per-device-train-batch-size = 8
train.training-arguments.per-device-eval-batch-size = 8
train.training-arguments.logging-steps = 32
train.training-arguments.report-to = "none"
train.training-arguments.num-train-epochs = 1
train.training-arguments.max-steps = 10 # TODO: Comment this
train.training-arguments.save-steps = 1000
train.training-arguments.save-total-limit = 2
train.training-arguments.gradient-checkpointing = false
train.training-arguments.lr-scheduler-type = "constant"

# -- Federation ----------------------------------------------------------------
num-server-rounds = 10
num-clients = 50

# -- Device-profile simulation -------------------------------------------------
device-profile-path = "device_profiles/default/profiles.json"
server.heartbeat-timeout-s = 30.0

# -- Evaluation ----------------------------------------------------------------
eval.batch-size = 32
eval.max-samples = 320 # TODO: Comment this

# -- Experiment tracking -------------------------------------------------------
wandb.project = "u-flora-testbed"
wandb.entity = "ilham-abdillah-alhamdi-universitas-indonesia"
wandb.run-name = ""

# -- Client selection strategy -------------------------------------------------
# name: random | fedcs | tifl | oort
strategy.name = "random"

strategy.seed = 42
strategy.num-to-select = 10 # for fixed k strategies like random, tifl, oort

strategy.fedcs.round-deadline-s = 120.0
strategy.fedcs.c-fraction = 0.5 # Fraction of clients to request device profiles from each round

strategy.tifl.num-tiers = 5 # Number of TiFL tiers
strategy.tifl.sync-rounds = 2 # Number of rounds at offline profiling before creating tiers
strategy.tifl.prob-update-interval = 5 # Number of rounds to update tier selection probability
strategy.tifl.round-deadline-s = 360.0 # Deadline for preround client profiling 

strategy.oort.epsilon = 0.9  # Fraction of clients to explore (vs exploit) each round
strategy.oort.alpha = 0.2    # How much to weight recency vs historical
strategy.oort.pacer-window = 5 # Rounds to look back when adjusting selection probabilities
strategy.oort.pacer-delta = 15 # Time in seconds to add/relax developer-preferred deadline
strategy.oort.initial-t = 120 # Initial developer-preferred deadline in seconds
strategy.oort.cutoff-c = 0.95 # Percentage of utility cutoff from k-th ranked client to consider for selection
strategy.oort.max-participation-rounds = 5 # Maximum rounds a client can participate
strategy.oort.utility-clip-percentile = 95 # Percentile for clipping utility values to avoid outliers dominating selection


# ==============================================================================
# Dataset definitions
# ==============================================================================

[tool.flwr.app.config.datasets.boolq]
name = "super_glue"
subset = "boolq"
text_fields = "passage,question"
label_field = "label"
num_labels = 2
train_split = "train"
val_split = "validation"

[tool.flwr.app.config.datasets.mnli]
name = "glue"
subset = "mnli"
text_fields = "premise,hypothesis"
label_field = "label"
num_labels = 3
train_split = "train"
val_split = "validation_matched"

