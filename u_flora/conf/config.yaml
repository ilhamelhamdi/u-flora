defaults:
  - task: text_classification
  - model: distilbert
  - dataset: sst2
  - lora: default
  - strategy: random
  - _self_

# FL settings
num_server_rounds: 100
num_clients: 50
fraction_train: 0.2

# Training
train:
  learning_rate_max: 5e-4
  learning_rate_min: 1e-5
  save_every_round: 10

# Evaluation
eval:
  batch_size: 64

# Experiment tracking
wandb:
  project: "u-flora"
  entity: ""
  run_name: ""

# Device profile paths (for heterogeneity simulation)
device_profiles:
  network_trace: null    # path to MobiPerf JSON
  compute_trace: null    # path to Oort client_device_capacity JSON
  num_profiles: 1000
  seed: 42