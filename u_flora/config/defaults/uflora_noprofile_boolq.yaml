strategy: uflora
task: boolq
# Group 3 ablation: U-Flora without async profiling. Mandatory-optional
# structure is active, but the optional set draws only from previously-explored
# clients (no profiled-only candidates). Isolates the contribution of the
# mandatory-optional structure independent of the discovery mechanism.
#
# TODO: requires `uflora` strategy implementation; `p-max=0` disables async
#       profiling entirely.
overrides:
  - "task-name=text_classification"
  - "dataset.name=boolq"
  - "num-clients=50"
  - "device-profile-path=device_profiles/50/default/profiles.json"
  - "strategy.name=uflora"
  - "strategy.num-to-select=5"
  # Mandatory-optional knobs
  - "strategy.uflora.min-k=5"
  - "strategy.uflora.d-max=5"             # K_actual ∈ [5, 10]
  - "strategy.uflora.p-max=0"             # async profiling disabled
  - "strategy.uflora.lambda-max=1.0"
  - "strategy.uflora.dm-ema-beta=0.3"
  - "strategy.uflora.alpha-ema=0.3"
  # Inherited Oort utility knobs
  - "strategy.oort.alpha=2.0"
  - "strategy.oort.utility-clip-percentile=95"
  - "dataset.partition.strategy=dirichlet"
  - "dataset.partition.dirichlet.alpha=8"
