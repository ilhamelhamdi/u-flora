strategy: oort
task: boolq
overrides:
  - "task-name=text_classification"
  - "dataset.name=boolq"
  - "num-clients=50"
  - "device-profile-path=device_profiles/50/default/profiles.json"
  - "strategy.name=oort"
  - "strategy.num-to-select=5"
  - "strategy.oort.epsilon=0.9"
  - "strategy.oort.alpha=2.0"
  - "strategy.oort.pacer-window=10"
  - "strategy.oort.pacer-delta=15"
  - "strategy.oort.initial-t=120"
  - "strategy.oort.cutoff-c=0.95"
  - "strategy.oort.max-participation-rounds=10"
  - "strategy.oort.utility-clip-percentile=95"
  - "dataset.partition.strategy=dirichlet"
  - "dataset.partition.dirichlet.alpha=8"
