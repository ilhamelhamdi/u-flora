strategy: fedcs_uncapped
task: mnli
# Group 3 variant: full FedCS deadline-filling, no K cap.
overrides:
  - "task-name=text_classification"
  - "dataset.name=mnli"
  - "num-clients=300"
  - "device-profile-path=device_profiles/300/default/profiles.json"
  - "strategy.name=fedcs"
  - "strategy.num-to-select=300"          # set to N (effectively uncapped)
  - "strategy.fedcs.round-deadline-s=750.0"
  - "strategy.fedcs.c-fraction=0.5"
  - "dataset.partition.strategy=dirichlet"
  - "dataset.partition.dirichlet.alpha=8"
