strategy: fedcs_uncapped
task: boolq
# Group 3 variant: full FedCS deadline-filling, no K cap. Allows variable K
# bounded only by the deadline. Comparison target for U-Flora-full.
overrides:
  - "task-name=text_classification"
  - "dataset.name=boolq"
  - "num-clients=50"
  - "device-profile-path=device_profiles/50/default/profiles.json"
  - "strategy.name=fedcs"
  - "strategy.num-to-select=50"           # set to N (effectively uncapped)
  - "strategy.fedcs.round-deadline-s=120.0"
  - "strategy.fedcs.c-fraction=0.5"
  - "dataset.partition.strategy=dirichlet"
  - "dataset.partition.dirichlet.alpha=8"
