description: >
  Group 2 — Statistical Heterogeneity Sensitivity (RQ1). MNLI only, all four
  baselines, two new Dirichlet conditions. alpha=8 is reused from
  group1-300, so this group only contributes the new alpha values.
    - alpha=2  (high non-IID, strong label concentration)
    - iid     (uniform partition; dataset.partition.strategy=iid)
  Three seeds per configuration. Total: 4 (strategy) x 2 (alpha) x 3 (seed) = 24 runs.

superlink-connection: "local-300"
experiments:
  # ====================== seed = 42 ======================
  # alpha = 2.0 (high non-IID)
  - { name: g2_random_mnli_a2_s42, base: random_mnli, overrides: ["seed=42", "dataset.partition.dirichlet.alpha=2"] }
  - { name: g2_fedcs_mnli_a2_s42,  base: fedcs_mnli,  overrides: ["seed=42", "dataset.partition.dirichlet.alpha=2"] }
  - { name: g2_tifl_mnli_a2_s42,   base: tifl_mnli,   overrides: ["seed=42", "dataset.partition.dirichlet.alpha=2"] }
  - { name: g2_oort_mnli_a2_s42,   base: oort_mnli,   overrides: ["seed=42", "dataset.partition.dirichlet.alpha=2"] }

  # IID
  - { name: g2_random_mnli_iid_s42, base: random_mnli, overrides: ["seed=42", "dataset.partition.strategy=iid"] }
  - { name: g2_fedcs_mnli_iid_s42,  base: fedcs_mnli,  overrides: ["seed=42", "dataset.partition.strategy=iid"] }
  - { name: g2_tifl_mnli_iid_s42,   base: tifl_mnli,   overrides: ["seed=42", "dataset.partition.strategy=iid"] }
  - { name: g2_oort_mnli_iid_s42,   base: oort_mnli,   overrides: ["seed=42", "dataset.partition.strategy=iid"] }

