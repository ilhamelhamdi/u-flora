description: >
  Group 1 — Main Benchmark.
  All four strategies (Random, FedCS, TiFL, Oort) on both tasks (BoolQ, MNLI) under moderate non-IID (Dirichlet alpha=8) and realistic system heterogeneity, three seeds per configuration. Total: 4 (strategy) x 2 (task) x 3 (seed) = 24 runs.

experiments:
  # ====================== seed = 42 (enabled) ======================
  - { name: g1_random_boolq_s42, base: random_boolq, overrides: ["seed=42"] }
  - { name: g1_fedcs_boolq_s42, base: fedcs_boolq, overrides: ["seed=42"] }
  - { name: g1_tifl_boolq_s42, base: tifl_boolq, overrides: ["seed=42"] }
  - { name: g1_oort_boolq_s42, base: oort_boolq, overrides: ["seed=42"] }

  - { name: g1_random_mnli_s42, base: random_mnli, overrides: ["seed=42"] }
  - { name: g1_fedcs_mnli_s42, base: fedcs_mnli, overrides: ["seed=42"] }
  - { name: g1_tifl_mnli_s42, base: tifl_mnli, overrides: ["seed=42"] }
  - { name: g1_oort_mnli_s42, base: oort_mnli, overrides: ["seed=42"] }

