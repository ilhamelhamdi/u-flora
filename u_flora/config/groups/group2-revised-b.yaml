description: >
  Group 2 — Statistical Heterogeneity Sensitivity (RQ1). MNLI only, all four
  baselines, two new Dirichlet conditions. alpha=2 is reused from
  group1-300, so this group only contributes the new alpha values.
    - alpha=0.5  (high non-IID, strong label concentration)
    - iid     (uniform partition; dataset.partition.strategy=iid)
  Three seeds per configuration. Total: 4 (strategy) x 2 (alpha) x 3 (seed) = 24 runs.

superlink-connection: "local-300"
max-experiment-duration-s: 28800
experiments:
  # ====================== seed = 456 ======================
  - {
      name: g2_random_mnli_a05_s456,
      bases: [pools/300, datasets/mnli, strategies/random],
      overrides: ["seed=456", "dataset.partition.dirichlet.alpha=0.5", "wandb.run-name=a0.5-v1"],
    }
  - {
      name: g2_fedcs_mnli_a05_s456,
      bases: [pools/300, datasets/mnli, strategies/fedcs, strategies/fedcs_300],
      overrides: ["seed=456", "dataset.partition.dirichlet.alpha=0.5", "wandb.run-name=a0.5-v1"],
    }
  - {
      name: g2_tifl_mnli_a05_s456,
      bases: [pools/300, datasets/mnli, strategies/tifl, strategies/tifl_300],
      overrides: ["seed=456", "dataset.partition.dirichlet.alpha=0.5", "wandb.run-name=a0.5-v1"],
    }
  - {
      name: g2_oort_mnli_a05_s456,
      bases: [pools/300, datasets/mnli, strategies/oort],
      overrides: ["seed=456", "dataset.partition.dirichlet.alpha=0.5", "wandb.run-name=a0.5-v4"],
    }
