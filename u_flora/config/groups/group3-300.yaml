description: >
  Group 3 — Algorithm Evaluation (RQ2) — MNLI only (300 clients pool).
  Compares U-Flora variants against adaptive-K baselines and ablations:
    - fedcs_overselect : FedCS with overselection capped at 2*K* (deadline-filling within cap).
    - oort_fair      : Oort + convergence-driven fairness lambda(t).
    - uflora_noprofile : mandatory-optional structure, no async profiling.
    - uflora_full    : complete proposed algorithm.
  Three seeds per configuration. Total: 4 (variant) x 1 (task) x 3 (seed) = 12 runs.

superlink-connection: "local-300"
experiments:
  # ====================== seed = 42 ======================
  - {
      name: g3_fedcs_overselect_mnli_s42,
      bases: [pools/300, datasets/mnli, strategies/fedcs_overselect_300],
      overrides: ["seed=42"],
    }
  - {
      name: g3_oort_fair_mnli_s42,
      bases: [pools/300, datasets/mnli, strategies/oort_fair, strategies/oort_fair_300],
      overrides: ["seed=42"],
    }
  - {
      name: g3_uflora_noprofile_mnli_s42,
      bases: [pools/300, datasets/mnli, strategies/uflora_noprofile_300],
      overrides: ["seed=42"],
    }
  - {
      name: g3_uflora_full_mnli_s42,
      bases: [pools/300, datasets/mnli, strategies/uflora_full_300],
      overrides: ["seed=42"],
    }

