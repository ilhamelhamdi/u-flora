description: >
  Group 1 — Main Benchmark (RQ1) - BoolQ only (50 clients pool).
  All four baselines (Random, FedCS-capped, TiFL, Oort-core) on BoolQ under moderate non-IID (Dirichlet alpha=8) and realistic system heterogeneity. Three seeds per configuration.  FedCS is capped at K* = num-to-select to make the K-budget comparable across strategies (deadline acts as eligibility filter only).
  Total: 4 (strategy) x 1 (task) x 3 (seed) = 12 runs.
superlink-connection: "local-50"
experiments:
  # ====================== seed = 42 ======================
  - {
      name: g1_random_boolq_s42,
      bases: [pools/50, datasets/boolq, strategies/random],
      overrides: ["seed=42"],
    }
  - {
      name: g1_fedcs_boolq_s42,
      bases: [pools/50, datasets/boolq, strategies/fedcs, strategies/fedcs_50],
      overrides: ["seed=42"],
    }
  - {
      name: g1_tifl_boolq_s42,
      bases: [pools/50, datasets/boolq, strategies/tifl, strategies/tifl_50],
      overrides: ["seed=42"],
    }
  - {
      name: g1_oort_boolq_s42,
      bases: [pools/50, datasets/boolq, strategies/oort, strategies/oort_50],
      overrides: ["seed=42"],
    }

