# Dataset: MNLI (natural language inference, text_classification task)
# Partitioning: Dirichlet alpha=8 (moderate non-IID) — override per experiment for other alphas
overrides:
  - "task-name=text_classification"
  - "dataset.name=mnli"
  - "dataset.partition.strategy=dirichlet"
  - "dataset.partition.dirichlet.alpha=2"
  - "dataset.partition.dirichlet.min-partition-size=32"
  - "train.training-arguments.num-train-epochs=1"
  - "num-server-rounds=50"
