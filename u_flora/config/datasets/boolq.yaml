# Dataset: BoolQ (binary reading comprehension, text_classification task)
# Partitioning: Dirichlet alpha=8 (moderate non-IID) — override per experiment for other alphas
overrides:
  - "task-name=text_classification"
  - "dataset.name=boolq"
  - "dataset.partition.strategy=dirichlet"
  - "dataset.partition.dirichlet.alpha=2"
  - "dataset.partition.dirichlet.min-partition-size=16"
  - "train.training-arguments.num-train-epochs=1"
  - "num-server-rounds=100"
  - "train.learning-rate-max=3e-5"
  - "train.learning-rate-min=3e-5"
  - "train.warmup-rounds=0"
