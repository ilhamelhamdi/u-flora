# Strategy: OortFair — pool-independent hyperparams
# Shares all Oort base params; adds convergence-driven fairness knobs (lambda-max, dm-ema-beta)
# Combine with oort_fair_50.yaml or oort_fair_300.yaml for pool-tuned timing
overrides:
  - "strategy.name=oort_fair"
  - "strategy.oort.epsilon=0.9"
  - "strategy.oort.epsilon-decay=0.98"
  - "strategy.oort.epsilon-min=0.2"
  - "strategy.oort.alpha=2.0"
  - "strategy.oort.pacer-window=10"
  - "strategy.oort.cutoff-c=0.95"
  - "strategy.oort.max-participation-rounds=20"
  - "strategy.oort.utility-clip-percentile=95"
  - "strategy.oort_fair.lambda-max=1.0"
  - "strategy.oort_fair.dm-ema-beta=0.3"
