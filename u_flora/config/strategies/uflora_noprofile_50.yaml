# U-Flora (no async profiling) for 50-client pool
# min-k = K* = 5, d-max = K* = 5 → K_actual in [5, 10]
# p-max=0 disables async profiling; isolates the mandatory-optional structure
overrides:
  - "strategy.name=uflora"
  - "strategy.uflora.min-k=5"
  - "strategy.uflora.d-max=5"
  - "strategy.uflora.p-max=0"
  - "strategy.uflora.lambda-max=1.0"
  - "strategy.uflora.dm-ema-beta=0.3"
  - "strategy.uflora.alpha-ema=0.3"
  - "strategy.oort.alpha=2.0"
  - "strategy.oort.utility-clip-percentile=95"
